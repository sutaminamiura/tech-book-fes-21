name: Release Book

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install PDF inspection tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils qpdf

      - run: npm run check
      - run: npm run build:ebook
      - run: npm run build:print
      - run: npm run verify:ebook
      - run: npm run verify:print

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: book-${{ github.ref_name }}
          path: dist/*.pdf
          if-no-files-found: error

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.pdf --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.pdf --generate-notes --verify-tag
          fi
