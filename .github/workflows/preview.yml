name: Preview PDF

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check

      - name: Build ebook preview
        if: ${{ hashFiles('manuscript/**/*.md') != '' }}
        run: npm run build:ebook

      - name: Build print-layout preview
        if: ${{ hashFiles('manuscript/**/*.md') != '' }}
        run: npm run build:print:draft

      - name: Upload previews
        if: ${{ hashFiles('manuscript/**/*.md') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: book-preview-${{ github.sha }}
          path: dist/*.pdf
          if-no-files-found: error
          retention-days: 14
